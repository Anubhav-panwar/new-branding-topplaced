<svg width="280" height="180" viewBox="0 0 280 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tier-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E6D4"/>
      <stop offset="100%" stop-color="#E8D9CC"/>
    </linearGradient>
    <linearGradient id="tier-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F28C45"/>
      <stop offset="100%" stop-color="#E85D04"/>
    </linearGradient>
  </defs>

  <!-- Horizon Base -->
  <line x1="30" y1="140" x2="250" y2="140" stroke="#E8D9CC" stroke-width="2" stroke-linecap="round"/>

  <!-- Step 1: Foundational Practice -->
  <rect x="40" y="105" width="50" height="35" rx="6" fill="url(#tier-grad-1)" stroke="#E8D9CC"/>
  <text x="65" y="126" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#70645C">STAGE 1</text>

  <!-- Step 2: System & Behavioral Mastery -->
  <rect x="105" y="80" width="50" height="60" rx="6" fill="url(#tier-grad-1)" stroke="#E8D9CC"/>
  <text x="130" y="114" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#70645C">STAGE 2</text>

  <!-- Step 3: Bar-Raiser Simulation (Active Tier) -->
  <rect x="170" y="55" width="50" height="85" rx="6" fill="url(#tier-grad-2)" stroke="#B94308" stroke-width="1.5"/>
  <text x="195" y="102" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#FFFFFF">OFFER</text>

  <!-- Dynamic connecting ascent trajectory -->
  <path d="M65 95 Q 130 50, 195 38" stroke="#E85D04" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3"/>

  <!-- TopPlaced Summit Diamond -->
  <g transform="translate(182, 16) scale(1.4)">
    <path d="M10 2L15.5 8L10 14L4.5 8L10 2Z" fill="#E85D04" stroke="#FFFFFF" stroke-width="1"/>
  </g>
</svg>
