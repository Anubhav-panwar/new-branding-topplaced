      <stop offset="0%" stop-color="#E85D04" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F28C45" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E85D04" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="mic-glow" cx="50%" cy="50%" r="50%">
