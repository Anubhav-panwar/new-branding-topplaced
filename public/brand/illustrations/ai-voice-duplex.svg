  <!-- Center Voice Node -->
  <rect x="122" y="72" width="36" height="36" rx="10" fill="#2B211C" stroke="#E85D04" stroke-width="1.5"/>
  <path d="M136 82 C136 79.8 137.8 78 140 78 C142.2 78 144 79.8 144 82 V89 C144 91.2 142.2 93 140 93 C137.8 93 136 91.2 136 89 Z" fill="#E85D04"/>
